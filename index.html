<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeBlink</title>

    <!-- Tab Icon -->
    <link
      rel="icon"
      href="./assets/images/logo_color.png"
      type="image/x-icon" />

    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/6383af2146.js"
      crossorigin="anonymous"></script>

    <!-- Google Fonts / Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bevan:ital@0;1&family=Black+Han+Sans&family=Calistoga&family=Candal&family=DynaPuff:wght@400..700&family=Itim&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sriracha&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet" />

    <!-- CSS -->
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <div class="wrapper">
        <div class="logoAndNav">
          <a href="#home">
            <img src="./assets/images/logo_color.png" alt="logo image" />
          </a>

          <!-- navbar -->
          <nav>
            <ul id="navMenu">
              <li><a href="#information" id="information">Информирај се</a></li>
              <li><a href="#discussion" id="discussion">Дискусии</a></li>
              <li><a href="#contact" id="contact">Контакт</a></li>
              <li class="hidden" id="profileNavLink">
                <a href="#profile">Профил</a>
              </li>
              <!-- mobile buttons -->
              <li id="mobileLogButtons">
                <a href="#login" id="loginBtnMobile">
                  <button class="headerBtn">
                    <img
                      src="./assets/svg_icons/profile_icon.svg"
                      alt="profile svg" />
                    <span>Најави се</span>
                  </button>
                </a>
                <button
                  id="logoutBtnMobile"
                  class="headerBtn hidden logoutButtons">
                  <span>Одјави се</span>
                </button>
              </li>
            </ul>
          </nav>

          <!-- hamburger icon -->
          <span class="hamburger-icon" id="hamburger">
            <i class="fas fa-bars"></i>
          </span>
        </div>

        <div class="actions">
          <a href="#profile">
            <img
              alt="profile-img"
              class="profile-img-header hidden"
              id="navProfileImg" />
          </a>
          <!-- login button for pc -->
          <a href="#login" id="loginBtn">
            <button class="headerBtn">
              <img
                src="./assets/svg_icons/profile_icon.svg"
                alt="profile-svg" />
              <span>Најави се</span>
            </button>
          </a>
          <!-- logout button for pc -->
          <button id="logoutBtn" class="headerBtn hidden logoutButtons">
            <span>Одјава</span>
          </button>
          <img
            src="./assets/svg_icons/mk-al_icon.svg"
            alt="language-icon"
            class="languages-icon" />
          <img
            src="./assets/svg_icons/search_icon.svg"
            alt="search-icon"
            class="search-icon" />
        </div>
      </div>
    </header>

    <script src="./js/main.js" type="module"></script>
  </body>
</html>
